<title>PocketRPG Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-handed phone column — header, scrolling step view, thumb-reach step bar at the bottom. */
:root{
  --bg:#E8EBEF; --surface:#FBFCFD; --sunk:#DCE1E7; --ink:#11151B; --muted:#566070;
  --line:#CBD2DA; --accent:#B35C00; --accent-ink:#FFFFFF; --accent-soft:#F5E2CB; --pin:#2D6AD0;
  --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#161A21; --sunk:#1F242D; --ink:#EDF0F4; --muted:#909AA9;
  --line:#2A313C; --accent:#FFA53D; --accent-ink:#1A1205; --accent-soft:#3A2810; --pin:#7EA9FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#161A21; --sunk:#1F242D; --ink:#EDF0F4; --muted:#909AA9;
  --line:#2A313C; --accent:#FFA53D; --accent-ink:#1A1205; --accent-soft:#3A2810; --pin:#7EA9FF; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:460px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand b{color:var(--accent);font-weight:800}
.chip{font:500 12px/1.3 var(--f-mono);color:var(--muted);text-align:right;min-width:0}

main{overflow-y:auto;padding-block:18px 28px;display:flex;flex-direction:column;gap:22px;-webkit-overflow-scrolling:touch}
h2{font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.eyebrow{font:700 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;color:var(--muted);font-size:15px}

.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;text-align:left;width:100%;min-height:68px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);grid-row:span 2}
.opt[aria-pressed="true"] .radio{border:8px solid var(--accent)}
.opt .t{font-weight:700;font-size:19px}
.opt .m{font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.opt .m.err{color:#C0392B}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 22px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:stretch;min-height:64px;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stepper button{border:0;background:var(--sunk);font:700 28px/1 var(--f-mono)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{display:grid;place-items:center;font:700 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.btn{min-height:62px;width:100%;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:800 23px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost[aria-pressed="true"]{border-color:var(--pin);color:var(--pin)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Story seed */
.sentence{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px;font:700 25px/1.4 var(--f-body);text-wrap:pretty;display:flex;flex-direction:column;gap:12px}
.sentence p{margin:0}
.part{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;border-radius:4px}
.part:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.vtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--sunk)}
.vtabs button{min-height:50px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 16px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em}
.vtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cols{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.col{all:unset;cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;min-height:66px;border-top:1px solid var(--line)}
.col:first-child{border-top:0}
.col:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.col .val{font-weight:700;font-size:18px;line-height:1.25}
.col .re{font:700 20px/1 var(--f-mono);color:var(--muted)}

.die{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:40px;height:40px;padding:6px;gap:2px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);flex:none}
.die i{border-radius:50%}
.die i.on{background:var(--ink)}
.die.sm{width:30px;height:30px;padding:5px;border-radius:7px}

/* Crew */
.pnav{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:stretch;min-height:60px;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.pnav button{border:0;background:var(--sunk);font:700 26px/1 var(--f-mono)}
.pnav button:disabled{opacity:.35;cursor:not-allowed}
.pnav>span{display:flex;align-items:center;justify-content:center;gap:8px}
.pnav b{font:700 19px/1 var(--f-mono)}
.pnav .of{color:var(--muted);font-size:15px}

.sentence.crew p{line-height:1.5}
.sentence.crew .nm{font-size:32px;line-height:1.3}
.part.fresh{animation:pop .45s ease-out}
.scalebtn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:56px;padding:6px 0 0;border-top:1px solid var(--line)}
.scalebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.scalebtn .lab{font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.scalebtn .ticks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.scalebtn .ticks i{height:12px;border-radius:3px;background:var(--sunk)}
.scalebtn .ticks i.on{background:var(--accent)}
.scalebtn .n{font:700 34px/1 var(--f-mono);color:var(--accent);min-width:1.2em;text-align:right}

.scrim{position:fixed;inset:0;background:rgba(5,8,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:rise .2s ease-out}
.sheet .field{grid-template-columns:minmax(0,1fr) 58px}
@keyframes rise{from{transform:translateY(24px);opacity:.6}}

.field{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:6px 8px;align-items:center}
.field>.eyebrow{grid-column:1/-1}
.field input,.field select,.sheet select,.sheet input{width:100%;min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 19px var(--f-body);padding:0 40px 0 14px;appearance:none;-webkit-appearance:none}
.field input,.sheet input{padding-right:14px}
.sel{position:relative;min-width:0}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dice{width:58px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.dice:active{transform:scale(.94)}

.fresh{animation:pop .45s ease-out}
@keyframes pop{from{background:var(--accent-soft)}}

/* Pack */
.check{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:15px}
.check li{padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.check code,.note code{font:500 13px var(--f-mono)}
.json{margin:0;overflow:auto;max-height:55vh;font:500 12px/1.5 var(--f-mono);background:var(--sunk);padding:12px;border-radius:12px;border:1px solid var(--line)}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:15px;align-self:flex-start;padding:8px 0}

/* Step bar */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{min-height:64px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tabs button .n{font:700 17px/1 var(--f-mono)}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}


/* v2: data-driven fields */
.part.empty{color:var(--muted);text-decoration-style:dashed}
.drows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font:400 17px/1.3 var(--f-body)}
.drow:last-child{border-bottom:0}
.drow:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.drow .eyebrow{grid-column:1}
.drow .v{grid-column:1;font-weight:700;color:var(--accent)}
.drow .v.empty{color:var(--muted);font-weight:400;font-style:italic}
.drow .chev{grid-column:2;grid-row:1/span 2;color:var(--muted);font:700 18px/1 var(--f-mono)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:999px;background:var(--sunk);font:400 13px/1 var(--f-body);color:var(--muted)}
.stat b{font:700 16px/1 var(--f-mono);color:var(--ink)}
.premise{margin:0;font-size:16px;line-height:1.45}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:6px 18px;display:flex;flex-direction:column}
.sheet .stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.sheet .free{min-height:52px;width:100%;border-radius:12px;border:2px dashed var(--line);background:var(--bg);color:var(--ink);font:700 17px var(--f-body);padding:0 14px}
.sheet .row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:8px;align-items:start}
.empty-card{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted)}
/* v3: Roll for Shoes skill tree */
.skills{display:flex;flex-direction:column}
.skill{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:58px;padding:8px 0;border-top:1px solid var(--line);font:700 18px/1.25 var(--f-body)}
.skill:first-child{border-top:0}
.skill.root{grid-template-columns:minmax(0,1fr) auto}
button.skill{cursor:pointer}
button.skill:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skill .sn{min-width:0}
.skill.child .sn{color:var(--accent)}
.skill .sn.empty{color:var(--muted);font-style:italic;font-weight:400}
.skill .tw{color:var(--muted);font:500 18px/1 var(--f-mono);padding-left:6px}
.skill .lv{display:flex;align-items:baseline;gap:2px;padding:7px 10px;border-radius:9px;background:var(--sunk);font:700 20px/1 var(--f-mono)}
.skill .lv small{font-size:12px;color:var(--muted)}
.skill .chev{color:var(--muted);font:700 18px/1 var(--f-mono)}
.skill.fresh{animation:pop .45s ease-out}
.skill .sn small{display:block;font:400 12px/1.3 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.skill.status .tw{color:var(--accent)}
.skill .lv.neg{color:var(--accent)}
.drow .qt{grid-column:1;font:700 16px/1.3 var(--f-body);color:var(--ink)}
.outline{list-style:none;margin:0;padding:0;counter-reset:sc;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
.outline li{counter-increment:sc;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:14px 16px;border-top:1px solid var(--line);font-size:16px;line-height:1.4}
.outline li:first-child{border-top:0}
.outline li::before{content:counter(sc);grid-row:1/span 3;font:700 22px/1.1 var(--f-mono);color:var(--accent)}
.outline b{font:800 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.outline .rolls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.outline .rolls i{font:500 12px/1 var(--f-mono);font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--sunk);padding:5px 8px;border-radius:999px}
/* v4: Phase 3 play — sticky result card, generator grid, character roll controls, dice dock, log */
.app{grid-template-rows:auto minmax(0,1fr) auto auto auto}
.tabs{grid-template-columns:repeat(5,1fr)}
.playtop{position:sticky;top:-18px;z-index:5;margin-top:-18px;padding-top:18px;padding-bottom:6px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.result{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.result.pinned{border-color:var(--pin)}
.result.empty{border:2px dashed var(--line)}
.result.fresh{animation:pop .45s ease-out}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
.rhead .eyebrow{min-width:0;overflow-wrap:anywhere}
.rbig{all:unset;cursor:pointer;font:700 28px/1.2 var(--f-body);text-wrap:pretty;overflow-wrap:anywhere;border-radius:6px}
.rbig:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rbig.num{font:700 54px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.rbig.static{cursor:default}
.rsub{margin:0;font-size:16px;line-height:1.4;color:var(--muted)}
.rfoot{font:500 12px/1.3 var(--f-mono);color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.rfoot .relax{color:var(--accent)}
.pinbtn{flex:none;min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.pinbtn[aria-pressed="true"]{border-color:var(--pin);color:var(--pin)}
.pinbtn svg{width:14px;height:14px}
.dicerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dicerow .lab{font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);min-width:3.2em}
.dicerow .sum{font:700 24px/1 var(--f-mono);margin-left:4px}
.die.lg{width:50px;height:50px;padding:8px;border-radius:11px}
.die.ok{background:var(--accent-soft);border:2px solid var(--accent)}
.die.ok i.on{background:var(--accent)}
.die.ex{border:3px solid var(--pin)}
.die.ex i.on{background:var(--pin)}
.die.no{opacity:.4}
.d20{width:50px;height:50px;display:grid;place-items:center;border-radius:11px;background:var(--sunk);border:1px solid var(--line);font:700 20px/1 var(--f-mono)}
.outc{font:800 32px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.outc small{font:700 15px/1 var(--f-mono);color:var(--muted);letter-spacing:0;text-transform:none;margin-left:6px}
.callout{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}
.callout .t{font:700 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--pin)}
.callout.acc .t{color:var(--accent)}
.callout ul{margin:0;padding-left:18px}
.choice{min-height:48px;width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:left;padding:8px 12px;font-size:15px;line-height:1.3}
.choice b{display:block}
.choice[aria-pressed="true"]{border-color:var(--pin);background:var(--surface)}
.mini-btn{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 15px var(--f-body);padding:0 14px;align-self:flex-start}
.mini-btn.acc{border-color:var(--accent);color:var(--accent)}
.recent{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rchip{flex:none;max-width:62%;min-height:46px;padding:5px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.rchip small{font:500 10px/1.2 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rchip span{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rchip.pinned{border-color:var(--pin)}
.ptabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--sunk);overflow-x:auto;scrollbar-width:none}
.ptabs button{flex:1 0 auto;min-height:48px;max-width:9.5em;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 15px/1.1 var(--f-body);padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.gens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gens>:last-child:nth-child(odd){grid-column:1/-1}
.gen{min-height:82px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.gen b{font:800 clamp(17px,5vw,22px)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:normal;hyphens:auto}
.gen small{font:500 11px/1.3 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.gen.req small{color:var(--accent)}
.gen:active,.chk:active,.dock button:active{transform:scale(.97)}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:10px;border-top:1px solid var(--line);background:var(--bg)}
.dock:empty{display:none}
.dock button{min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);font:700 21px/1 var(--f-mono);display:flex;align-items:center;justify-content:center;gap:8px}
.dock button .die{width:26px;height:26px;padding:4px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tog{min-height:46px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:700 15px var(--f-body)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{min-height:112px;border-radius:16px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-width:0}
.chk.alt{background:var(--surface);color:var(--ink)}
.chk b{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.chk span{font:700 14px/1.2 var(--f-mono)}
.chk small{font-size:12px;line-height:1.3;opacity:.85}
.sentence.mini{font-size:19px;padding:14px 16px;gap:8px}
.sentence.mini .nm{font-size:24px}
.sentence.mini .scalebtn .n{font-size:28px}
.res{display:grid;grid-template-columns:minmax(0,1fr) 52px 4.2ch 52px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);font:700 24px/1 var(--f-mono)}
.res button:disabled{opacity:.35;cursor:not-allowed}
.res output{font:700 22px/1 var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
.res .st{display:block;font:400 13px/1.3 var(--f-body);color:var(--accent);text-transform:none;letter-spacing:0;margin-top:3px}
.skill.sroll{cursor:pointer;grid-template-columns:auto minmax(0,1fr) auto auto;padding-left:calc(var(--dep,0) * 18px)}
.skill.sroll .go{font:800 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:9px 12px;border-radius:9px}
.skill.sroll:disabled{opacity:.5;cursor:not-allowed}
.skill.earned .tw{padding-left:calc((var(--dep,1) - 1) * 18px + 6px)}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .lr{all:unset;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr);gap:2px 10px;min-width:0;border-radius:6px}
.logrow .lr:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.logrow time{font:500 12px/1.4 var(--f-mono);color:var(--muted);grid-row:span 2}
.logrow .lt{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.logrow .pinbtn{min-height:44px}
.catbtn{min-height:40px;border-radius:999px;border:2px solid var(--pin);color:var(--pin);background:var(--surface);font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:0 12px}
.empty-note{margin:0;color:var(--muted);font-size:15px;padding:14px 0}

/* v5: Track | Tools shell */
main>*{flex:none}
.hdr{display:flex;align-items:center;gap:10px;min-width:0}
.menubtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:none}
.menubtn i{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--ink)}
.tabs{grid-template-columns:repeat(2,1fr)}
.tabs button .n{font-size:20px}
.vtabs.three{grid-template-columns:repeat(3,1fr)}
.toolhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:-10px}
.back{min-height:44px;border:0;background:none;padding:0 4px 0 0;font:700 17px var(--f-body);color:var(--accent)}
.tres{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px 18px 16px;display:flex;flex-direction:column;gap:12px;min-height:150px;justify-content:center}
.tres.fresh{animation:pop .45s ease-out}
.tbig{font:700 34px/1.2 var(--f-body);text-wrap:balance;overflow-wrap:anywhere}
.tbig.num{font:700 72px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.tbig.glyph{font-size:64px;line-height:1.2;letter-spacing:.08em}
.tbig .xtra{color:var(--accent)}
.seg.dtype{grid-template-columns:repeat(4,1fr);grid-auto-flow:row}
.seg.dtype button{font-size:19px}
.seg.gmseg button{font-size:17px;min-height:52px}
.letterbtn{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 16px;min-height:58px}
.letterbtn .v{font-size:20px}
.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.letters button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:700 19px var(--f-mono)}
.letters button.any{grid-column:span 2;font-family:var(--f-body);font-size:16px}
.letters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.letters button:disabled{opacity:.3;cursor:not-allowed}
.tbig .ul{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.pcard.compact{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:4px 14px 14px;gap:10px}
.pcard.compact .prow{border-top:0;padding:10px 0 8px}
.checks.compact .chk{min-height:76px;padding:10px 12px}
.checks.compact .chk b{font-size:26px}
.reslist .res{padding:4px 0;border-top:0;grid-template-columns:minmax(0,1fr) 44px 4.2ch 44px}
.reslist .res button{min-height:44px;font-size:20px}
.reslist .res output{font-size:19px}
.pcard.compact .tog{min-height:42px;font-size:14px;padding:0 12px}
.skchip small{font:700 12px var(--f-mono);opacity:.75;margin-left:4px}
.skchips .tog{border-color:var(--accent);color:var(--accent)}
.plainsent .pv{color:var(--ink)}
.plainsent .pv.empty{color:var(--muted)}
.scalebtn.static{cursor:default}
dl.plain{margin:0;display:flex;flex-direction:column}
dl.plain>div{padding:10px 0;border-top:1px solid var(--line)}
dl.plain>div:first-child{border-top:0}
dl.plain dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
dl.plain dd.empty{color:var(--muted);font-weight:400}
.subroll{align-self:flex-end;margin-top:-12px}
.checkrow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--muted);cursor:pointer}
.checkrow input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.dock.one{grid-template-columns:2fr 1fr}
.dock .btn.keep{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.dock .btn.keep svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dock .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:800 23px/1 var(--f-display)}
.mock{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mockrow{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.mock .tog{min-height:40px;font-size:14px;padding:0 12px}
.story .seedline{margin:0;padding:14px 0 12px;font:700 20px/1.45 var(--f-body);text-wrap:pretty}
.gchips .tog{background:var(--sunk);border-color:var(--sunk)}
.pcard{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:2px solid var(--line)}
.pcard:last-of-type{border-bottom:0}
.rollbox{display:flex;flex-direction:column;gap:8px}
.prow{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:64px}
.prow:first-child{border-top:0}
.prow:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.prow .pn b{display:block;font-size:20px}
.prow .pn small{color:var(--muted);font-size:14px}
.prow .stats{grid-column:1}
.prow .chev{grid-column:2;grid-row:1/span 2;color:var(--muted);font:700 20px/1 var(--f-mono)}
.result.big{max-height:none;padding:18px}
.rollsheet{max-height:88vh;overflow-y:auto}
.mini-btn small{font-weight:400;color:var(--muted)}
.hrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow time{font:500 12px/1.6 var(--f-mono);color:var(--muted)}
.hrow .lt{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.empty-card code{font:500 14px var(--f-mono)}

@media (prefers-reduced-motion: reduce){.fresh,.part.fresh,.sheet{animation:none}.dice:active{transform:none}}

{"id":"emoji","label":"Emoji","version":"0.1.0","provenance":{"author":"PocketRPG","license":"Unicode emoji; placeholder selection, to be curated"},"modifiers":{},"entries":[{"v":"🗝️"},{"v":"🕯️"},{"v":"🗺️"},{"v":"⚔️"},{"v":"🛡️"},{"v":"🏹"},{"v":"🔮"},{"v":"📜"},{"v":"💀"},{"v":"🐉"},{"v":"🦉"},{"v":"🐺"},{"v":"🐍"},{"v":"🦇"},{"v":"🕷️"},{"v":"🌙"},{"v":"☀️"},{"v":"⭐"},{"v":"🌊"},{"v":"🔥"},{"v":"⛈️"},{"v":"🌲"},{"v":"🏔️"},{"v":"🏰"},{"v":"⛪"},{"v":"🏚️"},{"v":"🚪"},{"v":"🪜"},{"v":"⚓"},{"v":"🚂"},{"v":"🚀"},{"v":"🛸"},{"v":"🤖"},{"v":"👑"},{"v":"💍"},{"v":"💰"},{"v":"🎭"},{"v":"🎲"},{"v":"🃏"},{"v":"🧭"},{"v":"⏳"},{"v":"⚖️"},{"v":"🔒"},{"v":"🩸"},{"v":"🌹"},{"v":"🍷"},{"v":"🍞"},{"v":"🐎"},{"v":"🧪"},{"v":"📯"},{"v":"🪦"},{"v":"👁️"},{"v":"🗡️"},{"v":"🎻"},{"v":"🪞"},{"v":"🧶"}]}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const lc = s => (s || '').charAt(0).toLowerCase() + (s || '').slice(1);
const cap = s => (s || '').charAt(0).toUpperCase() + (s || '').slice(1);
const NO_REPEAT = 3;            // open question: window size. Mockup uses 3.
const KEY = 'pocketrpg-mockup-v5';

const ORDER = ['starfarers', 'swords-and-sorcery', 'blade-and-spirit', 'moon-and-blood', 'other-tales', 'the-heist', 'kitchen-khaos', 'minimon', 'outbreak-hotel', 'redshirt-recon', 'the-stranger'];
const RULES = { 'lasers-feelings': 'Lasers & Feelings', 'roll-for-shoes': 'Roll for Shoes' };
const native = (p, r) => !!p.flavour?.[r];

/* ---------- Packs ---------- */
const RAW = {}, PACKS = {};
document.querySelectorAll('script[data-pack]').forEach(s => {
  try { const p = JSON.parse(s.textContent); RAW[p.id] = p; } catch (e) { console.error('Pack JSON failed to parse', e); }
});
// extends: tables from listed packs are merged in; same table id = entries concatenated.
for (const [id, raw] of Object.entries(RAW)) {
  const p = JSON.parse(JSON.stringify(raw));
  for (const baseId of p.extends || []) {
    const base = RAW[baseId]; if (!base) continue;
    for (const [t, rows] of Object.entries(base.tables || {})) p.tables[t] = (p.tables[t] || []).concat(rows);
  }
  PACKS[id] = p;
}
const packIds = () => ORDER.filter(id => PACKS[id]).concat(Object.keys(PACKS).filter(id => !ORDER.includes(id))).filter(id => !PACKS[id].library);
const packBasis = p => `Based on ${p.name}${p.version ? ' v' + p.version : ''}`;

// Fallback when a pack has no lasers-feelings flavour.
const GENERIC_LF = {
  checks: [{ id: 'under', label: 'Lasers', roll: 'under' }, { id: 'over', label: 'Feelings', roll: 'over' }],
  numberRange: [2, 5],
  fields: [
    { id: 'name', label: 'Name', kind: 'text', table: null },
    { id: 'style', label: 'Style', kind: 'pick', values: ['Bold', 'Quiet', 'Clever', 'Kind', 'Stubborn', 'Curious'] },
    { id: 'role', label: 'Role', kind: 'pick', values: ['Leader', 'Fighter', 'Fixer', 'Talker', 'Seeker', 'Healer'] },
    { id: 'number', label: 'Number', kind: 'number', range: [2, 5] },
    { id: 'goal', label: 'Goal', kind: 'pick', values: ['Protect someone', 'Find something', 'Win respect', 'Escape the past', 'Learn the truth', 'Get rich'] }
  ],
  dice: { base: 1, bonuses: [], min: 1, max: 3 },
  exact: { name: 'Exact', countsAsSuccess: true }
};

const KINDS = ['pick', 'pick-or-text', 'multi', 'number', 'text'];
function validate(p) {
  const errs = [], T = p.tables || {}, ids = Object.keys(T);
  let entries = 0;
  for (const id of ids) for (const e of T[id]) {
    entries++;
    for (const [k, val] of Object.entries(e.tags || {})) {
      const m = p.modifiers?.[k];
      if (!m) { errs.push(`${id}: "${e.v}" uses tag "${k}", which is not a declared modifier`); continue; }
      for (const x of [].concat(val)) if (!m.values.includes(x)) errs.push(`${id}: "${e.v}" has ${k}=${x}, not a declared value`);
    }
  }
  const ref = (id, where) => { if (id && !T[id]) errs.push(`${where} references missing table ${id}`); };
  for (const g of p.generators || []) for (const m of g.output.matchAll(/\{([\w.-]+)\??(?:\|\w+)?\}/g)) ref(m[1], `generator "${g.id}"`);
  for (const c of p.seed?.columns || []) ref(c.table, `seed column "${c.label}"`);
  const checkFields = (list, name) => { for (const x of list) {
    if (!KINDS.includes(x.kind)) errs.push(`${name}.${x.id}: unknown kind "${x.kind}"`);
    ref(x.table, `${name}.${x.id}`); ref(x.examples, `${name}.${x.id}.examples`);
    if (x.generator && !(p.generators || []).some(g => g.id === x.generator)) errs.push(`${name}.${x.id} references missing generator ${x.generator}`);
  } };
  checkFields(p.groupFields || [], 'groupFields');
  for (const q of p.story?.questions || []) ref(q.table, `story question "${q.id}"`);
  for (const sg of p.story?.segments || []) for (const g of sg.tables || []) if (!(p.generators || []).some(x => x.id === g)) errs.push(`story segment "${sg.name}" references missing generator ${g}`);
  if (!p.flavour?.['lasers-feelings'] && !p.flavour?.['roll-for-shoes']) errs.push('pack has no rules flavour');
  const r = p.flavour?.['roll-for-shoes'];
  if (r) { checkFields(r.fields || [], 'roll-for-shoes.fields'); ref(r.starterSkills?.table, 'roll-for-shoes.starterSkills'); }
  const f = p.flavour?.['lasers-feelings'];
  if (f) {
    if (!Array.isArray(f.checks) || f.checks.length !== 2) errs.push('lasers-feelings.checks must have exactly two checks');
    checkFields(f.fields || [], 'fields');
    if (f.groupFields) errs.push('lasers-feelings.groupFields: move to the pack root');
    if (!(f.fields || []).some(x => x.kind === 'number')) errs.push('lasers-feelings.fields has no number field');
    if (typeof f.startingGear === 'string') ref(f.startingGear, 'startingGear');
    if (typeof f.exact?.questions === 'string') ref(f.exact.questions, 'exact.questions');
  }
  return { errs, tables: ids.length, entries };
}

/* ---------- Session state ---------- */
function blank() {
  return { view: 'setup', packId: packIds()[0], rulesId: 'lasers-feelings', players: 1, starter: null, answers: {},
           seed: null, seedTab: 'text', chars: [], group: {}, active: 0, recent: {}, lastModifiers: {}, log: [],
           tab: 'track', started: false, resultMode: 'sheet', openChar: null, panel: null, tool: null,
           toolMods: {}, toolHistory: [], trackHistory: [], bonuses: {}, apply: {}, gmDice: 0, inline: null };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && PACKS[s.packId]) return s; } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || blank();
const fresh = new Set();
let sheet = null;   // { scope: 'char' | 'group', id }
const pack = () => PACKS[S.packId];
function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
function log() {}   // setup-phase rolls are not logged; play uses trackLog / toolHistory

/* ---------- Table engine ---------- */
function matches(e, mods) {
  for (const [k, v] of Object.entries(mods || {})) {
    if (v == null || v === '') continue;
    const t = e.tags?.[k];
    if (t == null) continue;
    if (Array.isArray(t) ? !t.includes(v) : t !== v) return false;
  }
  return true;
}
function remember(id, v) { const r = (S.recent[id] || []).filter(x => x !== v); r.unshift(v); S.recent[id] = r.slice(0, NO_REPEAT); }
function draw(id, mods, avoid) {
  const pool = (pack().tables[id] || []).filter(e => matches(e, mods));
  if (!pool.length) return null;
  const recent = S.recent[id] || [];
  let c = pool.filter(e => e.v !== avoid && !recent.includes(e.v));
  if (!c.length) c = pool.filter(e => e.v !== avoid);
  if (!c.length) c = pool;
  const e = pick(c); remember(id, e.v); return e;
}
function expand(tpl, mods) {
  return tpl.replace(/\{([\w.-]+)(\?)?(?:\|(\w+))?\}/g, (m, id, opt, mod) => {
    if (opt && Math.random() < 0.4) return '';
    const e = draw(id, mods); return e ? (mod === 'lower' ? e.v.toLowerCase() : e.v) : '';
  }).replace(/\s+/g, ' ').trim();
}

/* ---------- L&F engine, driven by pack data ---------- */
function lf() {
  const p = pack(), own = p.flavour?.['lasers-feelings'];
  if (own) return own;
  const r = p.flavour?.['roll-for-shoes'];
  if (!r) return GENERIC_LF;
  // Fallback for Roll for Shoes settings: keep their character fields, add the number.
  return { ...GENERIC_LF, fallback: true, sentence: r.sentence,
    fields: [...r.fields.map(({ skill, status, ...f }) => f), { id: 'number', label: 'Number', kind: 'number', range: [2, 5] }] };
}
const chk = dir => lf().checks.find(c => c.roll === dir) || { label: dir };
const range = () => lf().numberRange || [2, 5];
/* ---------- Roll for Shoes flavour (pack data, or generic fallback) ---------- */
const GENERIC_SKILLS = ['Sneak', 'Hit hard', 'Talk my way out', 'Fix things', 'Notice details', 'Run', 'Climb', 'Lie', 'Patch wounds', 'Read old writing'];
const isRfs = () => S.rulesId === 'roll-for-shoes';
function rfs() {
  const p = pack(), own = p.flavour?.['roll-for-shoes'];
  if (own) return own;
  // Fallback: reuse the pack's name field and style x role tables, generic skill list.
  const nameF = p.flavour?.['lasers-feelings']?.fields?.find(x => x.id === 'name');
  const st = p.tables['lf.style'], ro = p.tables['lf.role'];
  const concepts = st && ro ? st.flatMap(a => ro.map(b => `${a.v} ${lc(b.v)}`)) : null;
  return { fallback: true, rootSkill: 'Do anything',
    fields: [nameF ? { ...nameF, label: 'Name' } : { id: 'name', label: 'Name', kind: 'text', table: null },
             concepts ? { id: 'concept', label: 'Concept', kind: 'pick-or-text', values: concepts } : { id: 'concept', label: 'Concept', kind: 'text', table: null }],
    sentence: '{name}\nis {a} {concept|lower}',
    starterSkills: { values: GENERIC_SKILLS, count: 0, max: 3, level: 2 } };
}
const rf = () => isRfs() ? rfs() : lf();
const rootSkill = () => rfs().rootSkill || 'Do anything';
const skillCfg = () => ({ count: 0, max: 3, level: 2, ...(rfs().starterSkills || {}) });
const starterCount = () => Math.min(skillCfg().max, S.starter ?? skillCfg().count);
function skillList() { const k = skillCfg(); return k.table && pack().tables[k.table] ? pack().tables[k.table].map(e => e.v) : (k.values || []); }
function skillTree(c) {
  // Nodes: root, setting-field skills, starting skills (children of root), then skills earned in play (child of any node).
  const nodes = [{ key: 'r', name: rootSkill(), level: 1, root: true, parent: null, depth: 0 }];
  for (const f of rfs().fields) if (f.skill) nodes.push({ key: 'f:' + f.id, name: c.fields[f.id], level: f.skill.level, field: f.id, label: shortLabel(f.label), parent: 'r' });
  (c.extra || []).forEach((n, i) => nodes.push({ key: 'x:' + i, name: n, level: skillCfg().level, extra: i, parent: 'r' }));
  (c.earned || []).forEach((sk, i) => nodes.push({ key: 'e:' + i, name: sk.name, level: sk.level, earned: i, parent: sk.parent }));
  const out = [nodes[0]];
  const walk = (k, d) => nodes.filter(n => n.parent === k).forEach(n => { n.depth = d; out.push(n); walk(n.key, d + 1); });
  walk('r', 1);
  return out;
}
function statuses(c) {
  return rfs().fields.filter(f => f.status && !isEmpty(c.fields[f.id]))
    .map(f => ({ text: (f.status.format || '{v}').replace('{v}', c.fields[f.id]), level: f.status.level, field: f.id, optional: f.status.optional }));
}
function pickSkill(c, cur) {
  const taken = new Set(skillTree(c).map(x => x.name));
  const pool = skillList().filter(v => !taken.has(v) && v !== cur);
  return pool.length ? pick(pool) : (cur || '');
}
const skillField = i => ({ id: String(i), label: `Starting skill ${+i + 1}`, kind: 'text', values: skillList(),
  hint: `Level ${skillCfg().level}: rolls ${skillCfg().level}d6. Branches from ${rootSkill()} 1.` });

const groupFieldsOf = () => pack().groupFields || pack().flavour?.['lasers-feelings']?.groupFields || [];
const fieldsOf = scope => scope === 'group' ? groupFieldsOf() : rf().fields;
function qField(id) {
  const q = (pack().story?.questions || []).find(x => x.id === id);
  return q && { id: q.id, label: q.text, kind: 'text', table: q.table || null, hint: 'Ask the table aloud. Typing the answer is optional.' };
}
const fieldDef = (scope, id) => scope === 'skill' ? skillField(id) : scope === 'q' ? qField(id) : fieldsOf(scope).find(f => f.id === id);
function getVal(scope, id) {
  if (scope === 'group') return S.group[id];
  if (scope === 'q') return S.answers?.[id] ?? '';
  const c = S.chars[S.active];
  if (scope === 'skill') return c.extra?.[+id] ?? '';
  if (scope === 'q') return S.answers[id] ?? '';
  return c.fields[id];
}

function listOf(f) {
  if (f.table && pack().tables[f.table]) return pack().tables[f.table].map(e => e.v);
  if (f.values) return f.values;
  return null;
}
function canRandom(f) {
  return f.kind === 'number' || !!listOf(f) || !!(f.examples && pack().tables[f.examples]) || !!f.generator;
}
function rollNumber(f, avoid) {
  const [lo, hi] = f.range || range(), nr = lf().numberRoll;
  for (let i = 0; i < 20; i++) {
    let n;
    if (f.randomise === 'numberRoll' && nr?.reroll) { do n = 1 + rnd(6); while (nr.reroll.includes(n)); }
    else n = lo + rnd(hi - lo + 1);
    if (n !== avoid) return n;
  }
  return lo;
}
function drawFrom(f, avoid) {
  if (f.table && pack().tables[f.table]) return draw(f.table, null, avoid)?.v;
  const list = listOf(f) || []; const c = list.filter(v => v !== avoid);
  return pick(c.length ? c : list);
}
function randomValue(f, cur) {
  if (f.kind === 'number') return rollNumber(f, cur);
  if (f.kind === 'multi') {
    const list = [...(listOf(f) || [])], out = [];
    while (out.length < (f.count || 2) && list.length) out.push(list.splice(rnd(list.length), 1)[0]);
    return out;
  }
  if (f.generator) {
    const g = pack().generators.find(g => g.id === f.generator);
    for (let i = 0; i < 6; i++) { const n = expand(g.output, S.lastModifiers[g.id]); if (n && n !== cur) return n; }
  }
  if (f.examples && pack().tables[f.examples]) return draw(f.examples, null, cur)?.v;
  if (listOf(f)) return drawFrom(f, cur);
  return cur ?? '';
}
function newCharacter() {
  const c = { id: Math.random().toString(36).slice(2, 8), fields: {}, resources: {} };
  for (const f of rf().fields) c.fields[f.id] = canRandom(f) ? randomValue(f) : (f.kind === 'multi' ? [] : '');
  if (isRfs()) {
    c.xp = 0;
    c.extra = [];
    for (let i = 0; i < starterCount(); i++) c.extra.push(pickSkill(c));
  } else syncResources(c);
  return c;
}
function syncResources(c) {
  for (const r of lf().resources || []) {
    const ok = !r.appliesTo || Object.entries(r.appliesTo).every(([k, v]) => c.fields[k] === v);
    if (ok && c.resources[r.id] == null) c.resources[r.id] = r.start;
    if (!ok) delete c.resources[r.id];
  }
}
function ensureState() {
  S.answers = S.answers || {};
  // Each rule system lists only its own packs; switching rules picks that system's first pack.
  if (!native(pack(), S.rulesId)) {
    const first = packIds().find(id => native(PACKS[id], S.rulesId));
    if (first) { S.packId = first; S.seed = null; S.group = {}; S.answers = {}; S.recent = {}; S.chars = []; S.active = 0; S.starter = null; }
  }
  while (S.chars.length < S.players) S.chars.push(newCharacter());
  if (S.active >= S.players) S.active = S.players - 1;
  for (const f of groupFieldsOf()) if (S.group[f.id] == null) S.group[f.id] = canRandom(f) ? randomValue(f) : (f.kind === 'multi' ? [] : '');
}
function derive(c) {
  const N = c.fields.number, out = [];
  for (const d of lf().derived || []) {
    let v = null;
    if (/^[\dN\s*+\-()/]+$/.test(d.formula)) { try { v = Function('N', `return (${d.formula})`)(N); } catch (e) {} }
    else { const ref = out.find(o => o.label.toLowerCase().startsWith(d.formula.toLowerCase())); if (ref) v = ref.v; }
    out.push({ label: d.label, v });
  }
  return out;
}
const shortLabel = l => l.replace(/\s*\(.*\)\s*$/, '');

/* ---------- Seed ---------- */
function seedCol(i, avoid) {
  const col = pack().seed.columns[i], t = pack().tables[col.table];
  const e = draw(col.table, null, avoid); return { v: e.v, face: t.indexOf(e) + 1 };
}
const seedPart = i => pack().seed.columns[i].case === 'lower' ? lc(S.seed[i].v) : S.seed[i].v;
function seedText() { return pack().seed.template.replace(/\{(\d+)\}/g, (m, i) => seedPart(+i)); }
function rollAll() {
  S.seed = pack().seed.columns.map((c, i) => seedCol(i));
  S.seed.forEach((_, i) => fresh.add('col' + i));
  log('seed', 'seed', seedText());
}

/* ---------- View helpers ---------- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function die(n, cls = '') {
  if (!PIPS[n]) return `<span class="die ${cls}" aria-label="${n}"></span>`;
  return `<span class="die ${cls}" role="img" aria-label="d6 showing ${n}">${[...Array(9)].map((_, i) => `<i${PIPS[n].includes(i) ? ' class="on"' : ''}></i>`).join('')}</span>`;
}
const fr = k => fresh.has(k) ? ' fresh' : '';
const show = v => Array.isArray(v) ? v.filter(Boolean).join(' & ') : (v ?? '');
const isEmpty = v => Array.isArray(v) ? !v.filter(Boolean).length : (v == null || v === '');

function renderSetup() {
  const opt = id => {
    const p = PACKS[id], v = validate(p);
    const status = `<span class="m${v.errs.length ? ' err' : ''}">${esc(packBasis(p))} · ${v.tables} tables · ${v.entries} entries${v.errs.length ? ` · ${v.errs.length} schema error${v.errs.length > 1 ? 's' : ''}` : ''}</span>`;
    return `<button class="opt" data-act="pack" data-id="${esc(id)}" aria-pressed="${id === S.packId}"><span class="radio"></span><span class="t">${esc(p.genre || p.name)}</span>${status}</button>`;
  };
  const own = packIds().filter(id => native(PACKS[id], S.rulesId));
  const L = lf(), d = L.dice || GENERIC_LF.dice;
  return `
  <section class="group"><div class="eyebrow">Step 1 of 3</div><h2>New session</h2></section>
  <section class="group"><div class="eyebrow">Rule system</div>
    <button class="opt" data-act="rules" data-id="lasers-feelings" aria-pressed="${!isRfs()}"><span class="radio"></span><span class="t">Lasers &amp; Feelings</span><span class="m">One number, two checks · ${d.min}–${d.max}d6 · number ${range().join('–')}</span></button>
    <button class="opt" data-act="rules" data-id="roll-for-shoes" aria-pressed="${isRfs()}"><span class="radio"></span><span class="t">Roll for Shoes</span><span class="m">Skill tree · level = d6 vs GM · XP on fail</span></button>
  </section>
  ${isRfs() ? `<section class="group"><div class="eyebrow">Starting skills per character</div>
    <div class="stepper">
      <button data-act="starter" data-d="-1" aria-label="Fewer starting skills"${starterCount() <= 0 ? ' disabled' : ''}>−</button>
      <output aria-live="polite">${starterCount()}</output>
      <button data-act="starter" data-d="1" aria-label="More starting skills"${starterCount() >= skillCfg().max ? ' disabled' : ''}>+</button>
    </div>
    <p class="hint">${starterCount() ? `Each character also starts with ${starterCount()} level-${skillCfg().level} skill${starterCount() > 1 ? 's' : ''} under ${esc(rootSkill())}. House rule.` : `Original rules: everyone starts with ${esc(rootSkill())} 1${rfs().fields.some(f => f.skill) ? ', plus any skills the setting gives' : ' only'}.`}</p>
  </section>` : ''}
  <section class="group"><div class="eyebrow">${isRfs() ? 'Setting' : 'Genre'}</div>${own.map(opt).join('') || '<p class="hint">No packs written for this rule system yet.</p>'}</section>  <section class="group"><div class="eyebrow">Players</div>
    <div class="stepper">
      <button data-act="players" data-d="-1" aria-label="Remove player"${S.players <= 1 ? ' disabled' : ''}>−</button>
      <output aria-live="polite">${S.players}</output>
      <button data-act="players" data-d="1" aria-label="Add player"${S.players >= 4 ? ' disabled' : ''}>+</button>
    </div>
    <p class="hint">One character per player. Up to 4.</p>
  </section>
  <button class="btn" data-act="go" data-v="seed">Story →</button>`;
}

function drows(scope, ids, emptyText = 'Not set') {
  return ids.map(id => {
    const f = fieldDef(scope, id), v = getVal(scope, id);
    return `<button class="drow${fr(id)}" data-act="openSheet" data-scope="${scope}" data-id="${esc(id)}">
      <span class="${scope === 'q' ? 'qt' : 'eyebrow'}">${esc(scope === 'q' ? f.label : shortLabel(f.label))}</span>
      <span class="v${isEmpty(v) ? ' empty' : ''}">${isEmpty(v) ? esc(emptyText) : esc(show(v))}</span>
      <span class="chev" aria-hidden="true">›</span></button>`;
  }).join('');
}

function defaultSentence() {
  const has = id => rf().fields.some(f => f.id === id);
  if (isRfs()) return `${has('name') ? '{name}\n' : ''}is {a} {concept|lower}`;
  return `${has('name') ? '{name}\n' : ''}is {a} {style|lower} {role|lower}${has('goal') ? ' who wants to\n{goal|lower}' : ''}`;
}
function sentenceHtml(c, plain) {
  const tpl = rf().sentence || defaultSentence();
  const used = new Set();
  const toks = tpl.split(/(\{[\w|]+\}|\n)/).filter(t => t !== '').map(t => {
    if (t === '\n') return { br: true };
    const m = t.match(/^\{(\w+)(?:\|(\w+))?\}$/);
    if (!m) return { text: t };
    if (m[1] === 'a') return { article: true, mod: m[2] };
    const f = fieldDef('char', m[1]);
    if (!f) return { text: '' };
    used.add(f.id);
    const v = c.fields[f.id], empty = isEmpty(v);
    let txt = empty ? shortLabel(f.label) : show(v);
    if (!empty && m[2] === 'lower') txt = lc(txt);
    return { field: f.id, txt, empty, cls: f.id === 'name' ? 'nm' : '' };
  });
  toks.forEach((t, i) => {
    if (!t.article) return;
    const next = toks.slice(i + 1).find(x => x.field);
    const a = /^[aeiou]/i.test(next?.txt || '') ? 'an' : 'a';
    t.text = t.mod === 'cap' ? cap(a) : a;
  });
  // Read-only view: drop empty fields and the comma that introduced them ("Casimir Dorn, —").
  if (plain) toks.forEach((t, i) => { if (t.field && t.empty) { t.drop = true; const prev = toks[i - 1]; if (prev?.text) prev.text = prev.text.replace(/,\s*$/, ''); } });
  const html = toks.filter(t => !t.drop).map(t => {
    if (t.br) return '<br>';
    if (t.field && plain) { const v = `<b class="pv${t.empty ? ' empty' : ''}">${esc(t.empty ? '—' : t.txt)}</b>`; return t.cls ? `<span class="${t.cls}">${v}</span>` : v; }
    if (t.field) {
      const b = `<button class="part${t.empty ? ' empty' : ''}${fr(t.field)}" data-act="openSheet" data-scope="char" data-id="${t.field}" id="cp-${t.field}">${esc(t.txt)}</button>`;
      return t.cls ? `<span class="${t.cls}">${b}</span>` : b;
    }
    return esc(t.text);
  }).join('');
  return { html, used };
}

function scaleHtml(n) {

/* ---------- Phase 3: shared helpers ---------- */
const LIB = {};
document.querySelectorAll('script[data-lib]').forEach(s => { try { LIB[s.dataset.lib] = JSON.parse(s.textContent); } catch (e) { console.error('Library JSON failed to parse', e); } });
const REG = LIB.registry?.tools || [];
const now = () => new Date().toISOString();
const hhmm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const roll = n => 1 + rnd(n);
function charName(c, i) {
  if (c.fields.name) return show(c.fields.name);
  const alt = c.fields.role || c.fields.concept || c.fields.form;
  return alt ? cap(show(alt)) : `Player ${i + 1}`;
}
function trackLog(kind, c, text) { S.trackHistory.push({ t: now(), kind, char: c ? charName(c, S.chars.indexOf(c)) : null, text }); }
const KIND = { roll: 'Roll', progress: 'Progress', resource: 'Resource', edit: 'Edit' };

let wake = null;
async function keepAwake() {
  if (wake || !S.started || !navigator.wakeLock || document.visibilityState !== 'visible') return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch (e) {}
}
document.addEventListener('visibilitychange', keepAwake);

function dieFace(v, sides, cls = '') {
  return sides === 6 ? die(v, 'lg ' + cls) : `<span class="d20 ${cls}" role="img" aria-label="d${sides} showing ${v}">${v}</span>`;
}
function slots(tpl) { return [...tpl.matchAll(/\{([\w.-]+)(\?)?(?:\|\w+)?\}/g)].filter(m => !m[2]).map(m => m[1]); }
function fmtData(d) {
  if (!d) return '';
  const parts = Object.entries(d).filter(([k]) => k !== 'text').map(([k, v]) => `${k} ${v}`);
  if (d.text) parts.push(d.text);
  return parts.join(' · ');
}

/* ---------- Tools: registry, library lists, pack generators ---------- */
const packTools = () => (pack().generators || []).map(g => ({ id: 'pack:' + g.id, label: g.label, kind: 'gen', gen: g }));
const toolById = id => id.startsWith('pack:') ? packTools().find(t => t.id === id) : REG.find(t => t.id === id);
const libList = id => LIB[id] || { entries: [], modifiers: {} };
const tmods = id => (S.toolMods[id] = S.toolMods[id] || {});
const initial = v => v.replace(/^the\s+/i, '').charAt(0).toUpperCase();
function libPool(listId, mods) {
  return libList(listId).entries.filter(e => matches(e, { ...mods, letter: null }) && (!mods.letter || initial(e.v) === mods.letter));
}
function libDraw(listId, mods, avoid) {
  const pool = libPool(listId, mods); if (!pool.length) return null;
  const key = 'lib:' + listId, recent = S.recent[key] || [];
  let c = pool.filter(e => !avoid.includes(e.v) && !recent.includes(e.v));
  if (!c.length) c = pool.filter(e => !avoid.includes(e.v));
  if (!c.length) return null;
  const e = pick(c); remember(key, e.v); return e;
}
function modDefs(t) {
  // [{ key, required, label, values, valueLabels }]
  const decl = t.kind === 'gen' ? pack().modifiers || {} : libList(t.list).modifiers || {};
  return ((t.kind === 'gen' ? t.gen.modifiers : t.modifiers) || []).map(m => ({ ...m, ...(decl[m.key] || {}), label: m.key === 'letter' ? 'Starting letter' : decl[m.key]?.label || cap(m.key) }));
}
const valLabel = (d, v) => d.valueLabels?.[v] || cap(v);
function effMods(t) {
  const m = { ...tmods(t.id) };
  for (const d of modDefs(t)) if (d.default === 'genre' && m[d.key] === undefined) {
    const g = d.key === 'setting' ? pack().nameSetting : pack()[d.key];
    if (g && (d.values || []).includes(g)) m[d.key] = g;
  }
  return m;
}
const diceMods = t => ({ count: tmods(t.id).count ?? t.dice.count.default, type: tmods(t.id).type ?? t.dice.defaultType });
const countOf = t => tmods(t.id).count ?? t.count.default;

function relax(defs, sel, ok) {
  let relaxed = false;
  for (const d of defs) { if (ok()) break; if (!d.required && sel[d.key]) { delete sel[d.key]; relaxed = true; } }
  return relaxed;
}
function rollTool() {
  const st = S.tool, t = toolById(st.id), prev = st.result?.text;
  const prevExtra = st.extra; st.extra = null;
  if (!t) { st.result = null; return; }
  if (t.kind === 'dice') {
    const m = diceMods(t), dice = [...Array(m.count)].map(() => roll(m.type));
    st.result = { text: String(dice.reduce((a, b) => a + b, 0)), dice, sides: m.type, note: `${m.count}d${m.type}${m.count > 1 ? ' = ' + dice.join(' + ') : ''}` };
  } else if (t.kind === 'gen') {
    const g = t.gen, mods = tmods(t.id), defs = modDefs(t);
    if (defs.some(d => d.required && !mods[d.key])) { st.result = null; return; }
    const sel = {}; for (const d of defs) if (mods[d.key]) sel[d.key] = mods[d.key];
    const relaxed = relax(defs, sel, () => slots(g.output).every(id => (pack().tables[id] || []).some(e => matches(e, sel))));
    const single = g.output.match(/^\{([\w.-]+)\}$/);
    let text = '', sub = '';
    for (let i = 0; i < 6; i++) {
      if (single) { const e = draw(single[1], sel, prev); text = e?.v || ''; sub = fmtData(e?.data); }
      else text = expand(g.output, sel);
      if (text !== prev) break;
    }
    st.result = text ? { text, sub, relaxed, mods: sel } : null;
  } else {
    const defs = modDefs(t), mods = effMods(t), sel = {};
    for (const d of defs) if (mods[d.key]) sel[d.key] = mods[d.key];
    const relaxed = relax(defs, sel, () => libPool(t.list, sel).length > 0);
    const n = t.count ? countOf(t) : 1, got = [], prevBase = st.result?.base?.[0] ?? prev;
    for (let i = 0; i < n; i++) { const e = libDraw(t.list, sel, n === 1 && prevBase ? [prevBase, ...got] : got); if (e) got.push(e.v); }
    // Optional parts (e.g. last name): drawn when switched on, filtered by the listed modifiers only.
    // Kept separate from the main result so the order option can re-order without rerolling.
    const drawn = [];
    if (got.length === 1) for (const part of t.parts || []) {
      if (!(tmods(t.id)[part.key] ?? part.default)) continue;
      const psel = {}; for (const k of part.filterBy || []) if (sel[k]) psel[k] = sel[k];
      const e = libDraw(part.list, psel, []);
      if (e) drawn.push({ key: part.key, v: e.v, before: e.position === 'before', join: part.join ?? ' ' });
    }
    st.result = got.length ? { base: got, drawn, relaxed, mods: sel, glyph: t.display === 'glyph' } : null;
    if (st.result) st.result.text = composeList(t, st.result);
    if (st.result && followOn(t)) st.extra = drawFollow(t, prevExtra);
  }
  fresh.add('tool'); buzz();
}
// Follow-up toggle (e.g. Names → Description): when on, every reroll also draws a new follow-up.
const followOn = t => !!(t.followUp && (tmods(t.id).followUp ?? t.followUp.default));
const drawFollow = (t, avoid) => libDraw(toolById(t.followUp.tool).list, {}, avoid ? [avoid] : [])?.v || null;
function composeList(t, r, html) {
  // An entry may prefer to lead (position: "before"), e.g. Japanese family names. Applied only while the order option is on.
  // html: escape, and underline each added part (e.g. the last name) for display.
  const fmt = v => html ? esc(v) : v;
  let out = fmt(r.base.join(t.join ?? ', '));
  for (const d of r.drawn || []) {
    const part = (t.parts || []).find(p => p.key === d.key);
    const lead = d.before && part?.order && (tmods(t.id)[d.key + ':order'] ?? part.order.default);
    const v = html ? `<span class="ul">${esc(d.v)}</span>` : d.v;
    out = lead ? v + fmt(d.join) + out : out + fmt(d.join) + v;
  }
  return out;
}
function leaveTool() {
  const st = S.tool; if (!st) return;
  const t = toolById(st.id), r = st.result;
  if (t && r?.text) S.toolHistory.push({ t: now(), tool: st.id, label: t.label, text: r.text + (st.extra ? (t.followUp?.join || ' — ') + st.extra : ''), relaxed: r.relaxed });
  S.tool = null;
}
function openTool(id) { leaveTool(); S.tab = 'tools'; S.panel = null; S.tool = { id }; rollTool(); $('#view').scrollTop = 0; }

function toolSub(t) {
  if (t.kind === 'dice') { const m = diceMods(t); return `${m.count}d${m.type}`; }
  const defs = modDefs(t), mods = t.kind === 'gen' ? tmods(t.id) : effMods(t);
  if (t.kind !== 'gen' && !libList(t.list).entries.length) return 'Empty list';
  const missing = defs.filter(d => d.required && !mods[d.key]);
  if (missing.length) return 'Choose ' + missing.map(d => d.label.toLowerCase()).join(', ');
  const set = defs.filter(d => mods[d.key]).map(d => d.key === 'letter' ? `Starts ${mods[d.key]}` : valLabel(d, mods[d.key]));
  for (const part of t.parts || []) if (tmods(t.id)[part.key] ?? part.default) set.push('+ ' + part.label.toLowerCase());
  if (followOn(t)) set.push('+ ' + t.followUp.label.toLowerCase());
  if (set.length) return set.join(' · ');
  if (t.count) return `${countOf(t)} at a time`;

}

/* ---------- Track: rules rolls ---------- */
const DEFAULT_OUT = [{ successes: 0, label: 'Goes wrong', text: 'GM says how things get worse.' }, { successes: 1, label: 'Barely', text: 'GM inflicts a complication, harm, or cost.' }, { successes: 2, label: 'Well', text: 'You do it well.' }, { successes: 3, label: 'Critical', text: 'GM tells you an extra effect.' }];
const numId = () => lf().fields.find(f => f.kind === 'number').id;
function lfPool(i) {
  const dc = lf().dice || GENERIC_LF.dice, on = S.bonuses[i] || {};
  const n = dc.base + (dc.bonuses || []).filter(b => on[b.id]).reduce((a, b) => a + b.dice, 0);
  return Math.max(dc.min, Math.min(dc.max, n));
}
function lfRoll(i, dir) {
  const c = S.chars[i], L = lf(), N = +c.fields[numId()], k = chk(dir), ex = L.exact || {};
  const n = lfPool(i), dice = [...Array(n)].map(() => roll(6));
  const marks = dice.map(v => v === N ? 'ex' : ((dir === 'under' ? v < N : v > N) ? 'ok' : 'no'));
  const succ = marks.filter(m => m === 'ok' || (m === 'ex' && ex.countsAsSuccess !== false)).length;
  const outs = [...(L.outcomes || DEFAULT_OUT)].sort((a, b) => b.successes - a.successes);
  const o = outs.find(x => succ >= x.successes) || outs[outs.length - 1];
  const bonuses = (L.dice?.bonuses || []).filter(b => S.bonuses[i]?.[b.id]).map(b => b.label);
  S.bonuses[i] = {};
  const e = { kind: 'lf', ci: i, who: charName(c, i), check: k.label, dir, N, dice, marks, successes: succ, outcome: o.label, outText: o.text, picks: o.picks, exact: marks.includes('ex'), bonuses };
  trackLog('roll', c, `${k.label} ${n}d6 ${dir} ${N}: ${dice.join(' ')} → ${o.label} (${succ} success${succ === 1 ? '' : 'es'})${e.exact ? ' · ' + (ex.name || 'exact') : ''}`);
  showRoll(e);
}
function rfsResolve(e) {
  e.sum = e.dice.reduce((a, b) => a + b, 0) + e.mod;
  e.gmSum = e.gm ? e.gm.reduce((a, b) => a + b, 0) : null;
  e.allSix = e.dice.every(v => v === 6);
  e.result = e.gm ? (e.sum > e.gmSum ? 'win' : e.sum < e.gmSum ? 'lose' : 'tie') : null;
  e.text = e.gm ? { win: 'Success', lose: 'Fail', tie: 'Tie' }[e.result] : `Total ${e.sum}`;
}
function rfsRoll(i, key) {
  const c = S.chars[i], sk = skillTree(c).find(s => s.key === key); if (!sk) return;
  const dice = [...Array(sk.level)].map(() => roll(6));
  const sts = statuses(c).filter(s => S.apply[i]?.[s.field]); S.apply[i] = {};
  const e = { kind: 'rfs', ci: i, who: charName(c, i), skill: key, skillName: sk.name, level: sk.level, dice,
    mod: sts.reduce((a, s) => a + s.level, 0), mods: sts.map(s => `${s.level} ${s.text}`), gm: S.gmDice ? [...Array(S.gmDice)].map(() => roll(6)) : null, spent: 0, xpGiven: false };
  rfsResolve(e);
  trackLog('roll', c, `${sk.name} ${sk.level}d6: ${dice.join(' ')}${e.mod ? ' (' + e.mod + ')' : ''}${dice.length > 1 || e.mod ? ' = ' + e.sum : ''}${e.gm ? ` vs GM ${e.gmSum}` : ''} → ${e.text}${e.allSix ? ' · all sixes' : ''}`);
  if (e.result === 'lose') giveFailXp(e);
  showRoll(e);
}
function giveFailXp(e) { const c = S.chars[e.ci]; if (e.xpGiven) return; c.xp = (c.xp || 0) + 1; e.xpGiven = true; trackLog('progress', c, `+1 XP (failed ${e.skillName})`); }
const xpAvail = e => (S.chars[e.ci].xp || 0) - (e.xpGiven ? 1 : 0);
function spendXp(e) {
  const c = S.chars[e.ci];
  if (xpAvail(e) < 1 || e.allSix) return;
  const idx = e.dice.reduce((b, v, j) => v < 6 && (b < 0 || v < e.dice[b]) ? j : b, -1);
  c.xp--; e.dice[idx] = 6; e.spent++; rfsResolve(e);
  trackLog('progress', c, `Spent 1 XP: a die becomes 6 (${e.skillName}, now ${e.sum}${e.gm ? ' vs ' + e.gmSum : ''})`);
  if (e.xpGiven && e.result !== 'lose') { c.xp--; e.xpGiven = false; trackLog('progress', c, '−1 XP: the roll no longer fails'); }
}
function showRoll(e) { S.roll = e; fresh.add('roll'); buzz(); if (S.resultMode === 'page') $('#view').scrollTop = 0; }

function rollBody(e) {
  if (e.kind === 'lf') {
    const ex = lf().exact || {};
    let h = `<div class="eyebrow">${esc(e.who)} · ${esc(e.check)} · ${e.dice.length}d6 ${e.dir} ${e.N}${e.bonuses.length ? ' · ' + esc(e.bonuses.join(', ')) : ''}</div>

      else if (typeof ex.questions === 'string') h += (e.exQ ? `<b>${esc(e.exQ)}</b>` : '') + `<button class="mini-btn" data-act="exq">${e.exQ ? 'Another question' : 'Draw a question'}</button>`;

  let h = `<div class="eyebrow">${esc(e.who)} · ${esc(e.skillName)} · ${e.level}d6${e.gm ? ` vs GM ${e.gm.length}d6` : ''}</div>
    <div class="dicerow"><span class="lab">Roll</span>${e.dice.map(v => dieFace(v, 6, v === 6 ? 'ok' : '')).join('')}${e.mod ? `<span class="sum">${e.mod}</span>` : ''}<span class="sum">= ${e.sum}</span></div>
    ${e.gm ? `<div class="dicerow"><span class="lab">GM</span>${e.gm.map(v => dieFace(v, 6, 'no')).join('')}<span class="sum">= ${e.gmSum}</span></div>` : ''}
    <div class="outc">${esc(e.text)}${e.spent ? `<small>${e.spent} XP spent</small>` : ''}</div>

    ${e.result === 'tie' ? '<p class="rsub">Tie. The GM decides; if it counts as a fail, add the XP.</p>' : ''}

  if (e.xpGiven) h += '<div class="callout acc"><span class="t">+1 XP for failing</span></div>';
  if (e.allSix) h += `<div class="callout acc"><span class="t">Every die is a 6</span><span>New skill at level ${e.level + 1}, branching from ${esc(e.skillName)}.</span>${e.newSkill ? `<b>Learned: ${esc(e.newSkill)} ${e.level + 1}</b>` : '<button class="mini-btn acc" data-act="newskill">Name the new skill</button>'}</div>`;
