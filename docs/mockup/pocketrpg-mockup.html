    ${plainRows(c, L.fields.filter(f => !used.has(f.id) && f.kind !== 'number').map(f => f.id))}
    ${lfControls(c, i, false)}
    ${inlineRoll(i)}`;
}
function rfsBody(c, i) {
  const { html, used } = sentenceHtml(c, true), tree = skillTree(c);
  return `
    <div class="sentence crew mini plainsent"><p>${html}</p><div class="stats"><span class="stat">XP <b>${c.xp || 0}</b></span><span class="stat">Skills <b>${tree.length}</b></span></div></div>
    ${plainRows(c, rf().fields.filter(f => !used.has(f.id) && !f.skill && !(f.status && !f.status.optional)).map(f => f.id))}
    ${rfsControls(c, i, false)}
    ${inlineRoll(i)}`;
}
const charBody = (c, i) => isRfs() ? rfsBody(c, i) : lfBody(c, i);
// Track: one compact card per character. Name row opens the character page; roll controls sit right under it.
function compactCard(c, i) {
  return `<div class="pcard compact" data-ci="${i}">
    <button class="prow" data-act="openchar" data-i="${i}"><span class="pn"><b>${esc(charName(c, i))}</b><small>${esc(partySub(c))}</small></span><span class="stats">${partyStats(c)}</span><span class="chev" aria-hidden="true">›</span></button>
    ${isRfs() ? rfsControls(c, i, true) : lfControls(c, i, true)}
    ${inlineRoll(i)}</div>`;
}
function gmControl() {
  if (!isRfs()) return '';
  return `<div class="group"><div class="eyebrow">Opposed by GM</div><div class="seg gmseg">${[0, 1, 2, 3, 4].map(n => `<button data-act="gm" data-n="${n}" aria-pressed="${S.gmDice === n}">${n ? n + 'd6' : 'Off'}</button>`).join('')}</div></div>`;
}
function partySub(c) {
  if (!isRfs()) return [show(c.fields.style), lc(show(c.fields.role))].filter(Boolean).join(' ');
  // Skip the field already standing in for a missing name.
  const nm = charName(c, S.chars.indexOf(c)).toLowerCase();
  const f = rf().fields.find(f => f.id !== 'name' && !isEmpty(c.fields[f.id]) && show(c.fields[f.id]).toLowerCase() !== nm);
  return f ? show(c.fields[f.id]) : '';
}
function partyStats(c) {
  if (isRfs()) return `<span class="stat">XP <b>${c.xp || 0}</b></span><span class="stat">Skills <b>${skillTree(c).length}</b></span>`;
  // Resources are shown as counters on the card, so only the number goes here.
  return `<span class="stat">N <b>${c.fields[numId()]}</b></span>`;
}
function storyCard() {
  const p = pack();
  let seed = '';
  if (p.seed) {
    if (!S.seed) rollAll();
    seed = p.seed.template.split(/(\{\d+\})/).map(s => {
      const m = s.match(/^\{(\d+)\}$/);
      return m ? `<button class="part${fr('col' + m[1])}" data-act="col" data-i="${m[1]}" aria-label="Reroll ${esc(p.seed.columns[m[1]].label)}">${esc(seedPart(+m[1]))}</button>` : esc(s);
    }).join('');
  }
  const qs = p.story?.questions || [], gf = groupFieldsOf(), pt = packTools();
  return `<section class="group"><div class="eyebrow">Story · ${esc(p.genre || p.name)}</div>
    <div class="card story">
      ${seed ? `<p class="seedline">${seed}</p>` : ''}
      ${qs.length || gf.length ? `<div class="drows"${seed ? '' : ' style="border-top:0"'}>${qs.length ? drows('q', qs.map(q => q.id), 'Not answered') : ''}${gf.length ? drows('group', gf.map(f => f.id)) : ''}</div>` : ''}
      ${!seed && !qs.length && !gf.length ? `<p class="hint" style="padding:12px 0">${esc(p.name)} has no story seed.</p>` : ''}
    </div>
    ${pt.length ? `<div class="chips gchips">${pt.map(t => `<button class="tog" data-act="tool" data-id="${esc(t.id)}">${esc(t.label)} ›</button>`).join('')}</div>` : ''}
  </section>`;
}
function mockupBar() {
  const opt = (act, v, l, cur) => `<button class="tog" data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`;
  return `<section class="mock" aria-label="Mockup options"><div class="eyebrow">Mockup options · pick one to compare</div>
    <div class="mockrow"><span>Roll result</span><div class="chips">${opt('rmode', 'sheet', 'Sheet', S.resultMode)}${opt('rmode', 'inline', 'Inline', S.resultMode)}${opt('rmode', 'page', 'Page', S.resultMode)}</div></div></section>`;
}
function renderTrackPlay() {
  if (S.panel === 'trackHistory') return renderHistory('track');
  if (S.roll && S.resultMode === 'page') return renderRollPage();
  if (S.openChar != null && S.chars[S.openChar]) return renderCharPage(S.openChar);
  const list = S.chars.slice(0, S.players).map((c, i) => compactCard(c, i)).join('');
  return `
  ${mockupBar()}
  ${storyCard()}
  <section class="group"><div class="eyebrow">Party</div>${gmControl()}${list}</section>
  <button class="btn ghost" data-act="panel" data-v="trackHistory">History · ${S.trackHistory.length}</button>`;
}
function renderCharPage(i) {
  const c = S.chars[i];
  const nav = S.players > 1 ? `<div class="pnav">
    <button data-act="openchar" data-i="${i - 1}" aria-label="Previous player"${i === 0 ? ' disabled' : ''}>←</button>
    <span><span class="eyebrow">Player</span> <b>${i + 1}</b> <span class="of">of ${S.players}</span></span>
    <button data-act="openchar" data-i="${i + 1}" aria-label="Next player"${i >= S.players - 1 ? ' disabled' : ''}>→</button></div>` : '';
  return `<div class="toolhead"><button class="back" data-act="party">‹ Track</button><span class="eyebrow">Character</span></div>
  ${nav}${gmControl()}<div class="pcard" data-ci="${i}">${charBody(c, i)}</div>`;
}
function renderHistory(which) {
  const items = (which === 'track' ? S.trackHistory : S.toolHistory).slice().reverse();
  const rows = items.map(h => `<div class="hrow"><time>${hhmm(h.t)}</time><div><span class="eyebrow">${esc(which === 'track' ? [KIND[h.kind], h.char].filter(Boolean).join(' · ') : h.label)}</span><div class="lt">${esc(h.text)}</div></div></div>`).join('');
  const empty = which === 'track' ? 'Rolls, XP, new skills, resource changes and edits appear here.' : 'Results you keep appear here. Leaving a tool keeps its result; Reroll discards it.';
  return `<div class="toolhead"><button class="back" data-act="panel" data-v="">‹ ${which === 'track' ? 'Track' : 'Tools'}</button><span class="eyebrow">This session</span></div>
  <h2>${which === 'track' ? 'Track' : 'Tools'} history</h2>
  <div class="card">${rows || `<p class="empty-note">${empty}</p>`}</div>`;
}
function wizSteps() {
  return `<div class="vtabs three" role="tablist" aria-label="Setup steps">${[['setup', '1 Setup'], ['seed', '2 Story'], ['crew', '3 Players']].map(([v, l]) => `<button role="tab" data-act="go" data-v="${v}" aria-selected="${S.view === v}">${l}</button>`).join('')}</div>`;
}
function renderMenu() {
  return `<div class="scrim" data-act="closeSheet"></div>
  <div class="sheet gutter" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <div class="eyebrow" id="sheet-t">Session · ${esc(pack().genre || pack().name)} · ${isRfs() ? 'Roll for Shoes' : 'Lasers & Feelings'}</div>
    <button class="btn ghost" data-act="panel" data-v="pack">Pack details</button>
    <button class="btn ghost" data-act="newSession">${sheet.confirm ? 'Tap again: clear this session' : 'New session'}</button>
    <p class="hint">New session clears characters, story and both histories.</p>
    <button class="btn" data-act="closeSheet">Close</button>
  </div>`;
}

/* ---------- Render + events ---------- */
const VIEWS = { setup: renderSetup, seed: renderSeed, crew: renderCrew };
function renderMain() {
  if (S.panel === 'pack') return `<div class="toolhead"><button class="back" data-act="panel" data-v="">‹ Back</button></div>` + renderPack();
  if (S.tab === 'tools') return S.panel === 'toolHistory' ? renderHistory('tools') : S.tool ? renderToolPage() : renderToolsHub();
  if (!S.started) return wizSteps() + VIEWS[S.view === 'pack' ? 'setup' : S.view]();
  return renderTrackPlay();
}
function renderSheetLayer() {
  if (sheet?.scope === 'menu') return renderMenu();
  if (sheet?.scope === 'letter') return S.tool ? renderLetterSheet() : '';
  if (sheet?.scope === 'newskill') return S.roll ? renderNewSkill() : '';
  if (sheet) return renderSheet();
  if (S.roll && S.resultMode === 'sheet' && S.tab === 'track' && S.started && !S.panel) return rollSheet();
  return '';
}
function render() {
  ensureState(); ensurePlayState();
  $('#view').innerHTML = renderMain();
  $('#sheet').innerHTML = renderSheetLayer();
  const t = S.tab === 'tools' && S.tool && !S.panel ? toolById(S.tool.id) : null;
  const canRe = t && !(t.kind === 'list' && !libList(t.list).entries.length) && !(t.kind === 'gen' && !S.tool.result);
  $('#dock').innerHTML = t ? `<button class="btn" data-act="reroll"${canRe ? '' : ' disabled'}>Reroll</button><button class="btn keep" data-act="toolBack" aria-label="Keep and close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></button>` : '';
  $('#dock').classList.toggle('one', !!t);
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === S.tab ? 'page' : 'false'));
  $('#chip').textContent = `${pack().genre || pack().name} · ${isRfs() ? 'RfS' : 'L&F'} · ${S.players}P${S.started ? '' : ' · setup'}`;
  fresh.clear();
  save();
  keepAwake();
}
function ensurePlayState() {
  for (const k of ['toolMods', 'bonuses', 'apply']) S[k] = S[k] || {};
  for (const k of ['toolHistory', 'trackHistory']) S[k] = S[k] || [];
  S.tab = S.tab || 'track'; S.resultMode = S.resultMode || 'sheet'; S.gmDice = S.gmDice || 0;
  if (S.openChar != null && S.openChar >= S.players) S.openChar = null;
  if (S.roll && !S.chars[S.roll.ci]) S.roll = null;
}
function setField(scope, id, value) {
  if (scope === 'group') { S.group[id] = value; return; }
  if (scope === 'q') { S.answers[id] = value; return; }
  const c = S.chars[S.active];
  if (scope === 'skill') { c.extra[+id] = value; return; }
  c.fields[id] = value;
  if (!isRfs()) syncResources(c);
}
function closeSheet() {
  // On Track in play, an edit made through a sheet is logged once, when the sheet closes.
  if (sheet && S.started && ['char', 'group', 'q', 'skill'].includes(sheet.scope)) {
    const after = getVal(sheet.scope, sheet.id), f = fieldDef(sheet.scope, sheet.id);
    if (JSON.stringify(after) !== sheet.before) {
      const fmt = v => isEmpty(v) ? '(blank)' : show(v);
      trackLog('edit', ['char', 'skill'].includes(sheet.scope) ? S.chars[S.active] : null, `${shortLabel(f.label)}: ${fmt(JSON.parse(sheet.before ?? 'null'))} → ${fmt(after)}`);
    }
  }
  sheet = null;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const host = b.closest('[data-ci]'); if (host) S.active = +host.dataset.ci;
  const { scope, id } = b.dataset, i = S.active;
  switch (b.dataset.act) {
    case 'tab': {
      const v = b.dataset.v;
      if (S.tab === 'tools') leaveTool();
      S.tab = v; S.panel = null; sheet = null; $('#view').scrollTop = 0; break;
    }
    case 'menu': sheet = { scope: 'menu' }; break;
    case 'newSession': if (!sheet.confirm) { sheet.confirm = true; break; } S = blank(); sheet = null; break;
    case 'panel': if (S.tab === 'tools' && b.dataset.v === 'pack') leaveTool(); S.panel = b.dataset.v || null; sheet = null; $('#view').scrollTop = 0; break;
    case 'go': S.view = b.dataset.v; sheet = null; $('#view').scrollTop = 0; break;
    case 'start': S.started = true; S.tab = 'track'; S.panel = null; S.openChar = null; $('#view').scrollTop = 0; trackLog('edit', null, `Session started · ${pack().genre || pack().name} · ${S.players} player${S.players > 1 ? 's' : ''}`); break;
    case 'pack': if (S.packId !== b.dataset.id) { S.packId = b.dataset.id; S.starter = null; S.answers = {}; S.seed = null; S.chars = []; S.group = {}; S.recent = {}; S.active = 0; } break;
    case 'rules': if (S.rulesId !== b.dataset.id) { S.rulesId = b.dataset.id; S.chars = []; S.active = 0; S.starter = null; } break;
    case 'starter': {
      const k = skillCfg(), n = Math.min(k.max, Math.max(0, starterCount() + +b.dataset.d));
      S.starter = n;
      for (const c of S.chars) { if (!c.extra) continue; while (c.extra.length < n) c.extra.push(pickSkill(c)); c.extra.length = n; }
      break;
    }
    case 'players': S.players = Math.min(4, Math.max(1, S.players + +b.dataset.d)); break;
    case 'rollAll': rollAll(); buzz(); break;
    case 'seedTab': S.seedTab = b.dataset.v; break;
    case 'col': { const k = +b.dataset.i; S.seed[k] = seedCol(k, S.seed[k].v); fresh.add('col' + k); if (S.started) trackLog('edit', null, `Story: ${seedText()}`); buzz(); break; }
    case 'ctab': S.active = +b.dataset.i; sheet = null; break;
    case 'openSheet': sheet = { scope, id, before: JSON.stringify(getVal(scope, id)) }; break;
    case 'closeSheet': closeSheet(); break;
    case 'randAll': { const old = S.chars[S.active]; const c = newCharacter(); rf().fields.forEach(f => { if (!canRandom(f)) c.fields[f.id] = old.fields[f.id]; fresh.add(f.id); }); (c.extra || []).forEach((_, k) => fresh.add('sk' + k)); S.chars[S.active] = c; buzz(); break; }
    case 'rand': { const f = fieldDef(scope, id); setField(scope, id, scope === 'skill' ? pickSkill(S.chars[S.active], getVal(scope, id)) : randomValue(f, getVal(scope, id))); if (scope === 'skill') fresh.add('sk' + id); fresh.add(id); buzz(); break; }
    case 'num': setField('char', sheet.id, +b.dataset.n); break;
    case 'reset': S = blank(); sheet = null; break;
    // Tools
    case 'tool': openTool(b.dataset.id); break;
    case 'toolBack': leaveTool(); $('#view').scrollTop = 0; break;
    case 'reroll': rollTool(); break;
    case 'tmod': {
      const t = toolById(S.tool.id), v = b.dataset.v, key = b.dataset.key;
      tmods(t.id)[key] = key === 'type' ? +v : v; rollTool(); break;
    }
    case 'tcount': {
      const t = toolById(S.tool.id), lim = t.kind === 'dice' ? t.dice.count : t.count, cur = t.kind === 'dice' ? diceMods(t).count : countOf(t);
      tmods(t.id).count = Math.min(lim.max, Math.max(lim.min, cur + +b.dataset.d)); rollTool(); break;
    }
    case 'tpart': tmods(S.tool.id)[b.dataset.key] = !!b.dataset.v; rollTool(); break;
    case 'tpartorder': {
      // Re-order the name on screen; no reroll.
      const t = toolById(S.tool.id); tmods(t.id)[b.dataset.key + ':order'] = b.checked;
      if (S.tool.result?.base) S.tool.result.text = composeList(t, S.tool.result);
      break;
    }
    case 'letters': sheet = { scope: 'letter' }; break;
    case 'letter': tmods(S.tool.id).letter = b.dataset.v; sheet = null; rollTool(); break;
    case 'followUp': { const t = toolById(S.tool.id); S.tool.extra = drawFollow(t, S.tool.extra); fresh.add('tool'); buzz(); break; }
    case 'tfollow': {
      // Toggling adds or removes the follow-up without rerolling the main result.
      const t = toolById(S.tool.id); tmods(t.id).followUp = !!b.dataset.v;
      S.tool.extra = followOn(t) && S.tool.result ? drawFollow(t, null) : null; fresh.add('tool'); break;
    }
    // Track
    case 'rmode': S.resultMode = b.dataset.v; break;
    case 'openchar': S.openChar = +b.dataset.i; S.active = S.openChar; $('#view').scrollTop = 0; break;
    case 'party': S.openChar = null; break;
    case 'gm': S.gmDice = +b.dataset.n; break;
    case 'bonus': { const on = S.bonuses[i] = S.bonuses[i] || {}; on[id] = !on[id]; break; }
    case 'apply': { const on = S.apply[i] = S.apply[i] || {}; on[id] = !on[id]; break; }
    case 'res': {
      const c = S.chars[i], r = lf().resources.find(x => x.id === id), old = c.resources[id];
      c.resources[id] = Math.max(0, Math.min(r.max, old + +b.dataset.d));
      const st = (r.states || []).filter(s => r.max - c.resources[id] >= s.lost).pop();
      trackLog('resource', c, `${r.label} ${old} → ${c.resources[id]}${st ? ' (' + st.label + ')' : ''}`); break;
    }
    case 'lfroll': lfRoll(i, b.dataset.dir); break;
    case 'rfsroll': rfsRoll(i, b.dataset.k); break;
    case 'rollDone': S.roll = null; break;
    case 'exopt': {
      const e = S.roll, o = lf().exact.options[+b.dataset.i]; e.exChoice = +b.dataset.i;
      trackLog('progress', S.chars[e.ci], `${lf().exact.name}: ${o.label}`); break;
    }
    case 'exq': { const e = S.roll; e.exQ = draw(lf().exact.questions, null, e.exQ)?.v; break; }
    case 'failxp': giveFailXp(S.roll); break;
    case 'spend': spendXp(S.roll); fresh.add('roll'); buzz(); break;
    case 'newskill': sheet = { scope: 'newskill', val: '' }; break;
    case 'nsrand': { const c = S.chars[S.roll.ci], taken = new Set(skillTree(c).map(s => s.name)), pool = skillList().concat(GENERIC_SKILLS).filter(v => !taken.has(v) && v !== sheet.val); if (pool.length) sheet.val = pick(pool); break; }
    case 'nsadd': {
      const e = S.roll, c = S.chars[e.ci], name = (sheet.val || '').trim();
      if (!name) break;
      c.earned = c.earned || []; c.earned.push({ name, level: e.level + 1, parent: e.skill }); e.newSkill = name;
      trackLog('progress', c, `New skill: ${name} ${e.level + 1} (from ${e.skillName})`); sheet = null; break;
    }
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset?.ns) { sheet.val = t.value; return; }
  const id = t.dataset?.field;
  if (!id || t.tagName !== 'INPUT') return;
  setField(t.dataset.scope, id, t.value); save();
  const part = $('#cp-' + id); if (part) { part.textContent = t.value || shortLabel(fieldDef(t.dataset.scope, id).label); part.classList.toggle('empty', !t.value); }
  if (t.dataset.free) { const s = t.closest('.stack')?.querySelector('select'); if (s) s.value = ''; }
});
document.addEventListener('change', e => {
  const t = e.target, id = t.dataset?.field;
  if (!id || t.tagName !== 'SELECT') return;
  const scope = t.dataset.scope;
  if (t.dataset.idx != null) { const arr = [...(getVal(scope, id) || [])]; arr[+t.dataset.idx] = t.value; setField(scope, id, arr); }
  else setField(scope, id, t.value);
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sheet) { closeSheet(); render(); } else if (S.roll && S.resultMode === 'sheet') { S.roll = null; render(); }
});

render();

</script>
